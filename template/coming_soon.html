
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIS Keio SFC - Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" id="favicon" type="image/png" href="logo.png" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #343a40;
            --primary-color: #003366; /* A professional blue, common in university branding */
            --subtle-color: #6c757d;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: left;
        }

        .container {
            max-width: 600px;
            padding: 20px;
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
            /*animation: pulse 4s infinite ease-in-out;*/
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin: 0 0 15px 0;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--subtle-color);
            margin: 0 0 30px 0;
        }

        .social-link {
            display: inline-block;
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .social-link:hover {
            background-color: #004d99;
            transform: translateY(-2px);
        }

        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            color: #adb5bd;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="AIS Keio SFC Logo" class="logo">

        <h1>Coming Soon</h1>
        <p>
            Our official website is under full construction.<br>
            For the latest events and important announcements, please visit our official Instagram.
        </p>
        <a href="https://www.instagram.com/aiskeiosfc" target="_blank" class="social-link">
            Subscribe our Instagram!
        </a>
    </div>

    <div class="footer">
        &copy; 2026 Association for International Students (AIS), Keio University SFC
    </div>

</body>
</html>
